<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Ikona Charona.

    Převozník, který vozí duše přes Styx — tedy přesně to, co ta aplikace dělá
    se soubory: bere je z jednoho břehu na druhý.

    Kreslí se na obrys, ne na siluetu. Předchozí podoba měla v lodi stojící
    postavu v kápi a ta se v Docku slila s trupem do jedné tmavé skvrny, ve
    které lidi poznávali spíš klobouk než člun. Teď nese význam samotná loď:
    světlý trup proti tmavé vodě, přes něj veslo. Dva tvary, obojí čitelné.

    Veslo je tu schválně šikmo. Svisle by bylo stabilnější, ale splynulo by
    s okrajem trupu; diagonála se od srpku odliší i na 32 bodech a dodá pohyb.

    Rozhoduje malá velikost — proto tu nejsou detaily, které by se ve 32
    bodech stejně slily. Kontrolovat se to dá kontaktním listem: totéž SVG
    vedle sebe ve 160, 96, 64, 48 a 32 bodech.
  -->
  <defs>
    <!-- Styx k ránu: nahoře skoro noc, u hladiny prosvětlená modř. -->
    <linearGradient id="voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a4c"/>
      <stop offset="0.5" stop-color="#134a76"/>
      <stop offset="1" stop-color="#1f74a0"/>
    </linearGradient>

    <!-- Mřížka Apple: obsah je čtverec 824 bodů uprostřed plátna 1024,
         se zaoblením 185. Zbytek plátna nechává místo na stín. -->
    <clipPath id="ramecek">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>

    <filter id="stin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b2338" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#stin)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#voda)"/>
  </g>

  <g clip-path="url(#ramecek)">
    <rect x="100" y="100" width="824" height="824" fill="url(#voda)"/>

    <!-- Veslo: násada a list zabraný do vody. Kreslí se pod trupem, aby
         vypadalo, že ho převozník drží za lodí, ne že leží přes ni. -->
    <g fill="#e6d8ba">
      <path d="M690 226 l60 32 -300 560 -60 -32 Z"/>
      <path d="M436 736 c -34 40 -66 62 -96 66 6 -30 26 -64 60 -104 Z"/>
    </g>

    <!-- Trup: srpek s vysoko vytaženou přídí i zádí, jak se malovaly antické
         čluny. Mělčí oblouk by v malém splynul s miskou. -->
    <path d="M162 470 C 192 700 336 806 512 806 C 688 806 832 700 862 470
             C 814 574 674 624 512 624 C 350 624 210 574 162 470 Z" fill="#f4ead6"/>

    <!-- Hladina. Dva tahy stačí; víc vln se ve 32 bodech slije v pruh. -->
    <path d="M140 862 C 300 826 402 890 546 862 C 690 834 792 876 890 854" fill="none"
          stroke="#ffffff" stroke-opacity="0.34" stroke-width="32" stroke-linecap="round"/>
    <path d="M162 946 C 322 912 424 972 566 944 C 708 916 806 956 898 936" fill="none"
          stroke="#ffffff" stroke-opacity="0.2" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
